# Render Blueprint: one web service with a persistent disk for accounts, bookings and photos.
# Render → New → Blueprint → pick this repository. Secret keys are asked for during setup (sync: false).
services:
  - type: web
    name: sashwanth-travels
    runtime: node
    region: singapore          # closest Render region to India
    plan: starter              # the free plan has no disk and sleeps when idle; bookings would be lost
    buildCommand: npm ci && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: PHOTOS
        value: "on"
      - key: PUBLIC_URL
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
